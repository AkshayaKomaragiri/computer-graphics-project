<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mars Terrain Explorer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      color: #ccc;
    }

    canvas { display: block; }

    /* ── HUD ─────────────────────────────────────────────── */
    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      pointer-events: none;
      user-select: none;
    }

    #hud h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #e8ddd0;
      margin-bottom: 4px;
    }

    #hud .sub {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: #7a7065;
    }

    #legend {
      position: fixed;
      bottom: 24px;
      left: 20px;
      font-size: 0.66rem;
      letter-spacing: 0.07em;
      color: #5a534d;
      pointer-events: none;
      line-height: 1.8;
    }

    #elevation-range { white-space: pre-line; }

    #controls {
      position: fixed;
      bottom: 24px;
      right: 20px;
      font-size: 0.65rem;
      letter-spacing: 0.07em;
      color: #5a534d;
      text-align: right;
      pointer-events: none;
      line-height: 1.8;
    }

    #site-picker {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.94);
      z-index: 20;
    }

    #site-picker.visible { display: flex; }

    #site-picker-panel {
      width: min(680px, 100%);
      max-height: 100%;
      overflow-y: auto;
    }

    #site-picker h2 {
      margin-bottom: 8px;
      color: #e8ddd0;
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #site-picker p {
      margin-bottom: 20px;
      color: #7a7065;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
    }

    #site-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .site-option {
      padding: 15px;
      border: 1px solid #39312a;
      background: #100e0c;
      color: #e8ddd0;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .site-option:hover,
    .site-option:focus-visible {
      border-color: #b18b67;
      background: #1b1612;
      outline: none;
    }

    .site-option strong,
    .site-option span {
      display: block;
    }

    .site-option strong {
      margin-bottom: 7px;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
    }

    .site-option span {
      color: #8d8175;
      font-size: 0.63rem;
      line-height: 1.6;
    }

    /* loading overlay */
    #loading {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 99;
      transition: opacity 0.6s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }

    #loading p {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #5a534d;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 2px solid #2a2520;
      border-top-color: #8a7e74;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading Mars sites…</p>
  </div>

  <div id="site-picker" role="dialog" aria-modal="true" aria-labelledby="site-picker-title">
    <div id="site-picker-panel">
      <h2 id="site-picker-title">Select a Mars site</h2>
      <p>Choose a location to explore its elevation terrain.</p>
      <div id="site-list"></div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <h1 id="site-name"></h1>
    <div class="sub" id="site-details"></div>
  </div>

  <div id="legend">
    ELEVATION RANGE<br>
    <span id="elevation-range"></span>
  </div>

  <div id="controls">
    LEFT DRAG  ·  orbit<br>
    RIGHT DRAG  ·  pan<br>
    SCROLL  ·  zoom<br>
    R  ·  reset camera
  </div>

  <!-- Three.js via CDN -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ── metadata ──────────────────────────────────────── */
    const JEZERO = {
      name: 'Jezero Crater',
      planet: 'Mars',
      source: 'NASA MOLA MEG128',
      heightmap: 'jezero_heightmap.png',
      location: { latitude: 18.4, longitude: 77.6 },
      elevation: { min: -2907, max: -1402, unit: 'meters' }
    };

    /* ── renderer ──────────────────────────────────────── */
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    /* ── scene / camera ────────────────────────────────── */
    const scene  = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const fov    = 45;
    const camera = new THREE.PerspectiveCamera(fov, window.innerWidth / window.innerHeight, 0.01, 1000);
    const INIT_CAM = new THREE.Vector3(0, 1.4, 2.0);
    camera.position.copy(INIT_CAM);

    /* ── orbit controls ────────────────────────────────── */
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping    = true;
    controls.dampingFactor    = 0.07;
    controls.minDistance      = 0.3;
    controls.maxDistance      = 8;
    controls.target.set(0, 0, 0);

    /* ── helpers ───────────────────────────────────────── */
    // Read heightmap PNG via canvas → pixel buffer
    function loadHeightData(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width  = img.naturalWidth;
          canvas.height = img.naturalHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
          resolve({ pixels: data.data, w: canvas.width, h: canvas.height });
        };
        img.onerror = reject;
        img.src = src;
      });
    }

    /* ── build mesh ────────────────────────────────────── */
    async function buildTerrain(site) {
      const heightmapSrc = site.name === JEZERO.name
        ? `data/${site.heightmap}`
        : `output/${site.heightmap}`;
      const { pixels, w, h } = await loadHeightData(heightmapSrc);

      // Plane segments match pixel grid (w-1 × h-1 quads)
      const segX = w - 1;
      const segZ = h - 1;

      // Physical size: keep aspect ratio, normalize longest axis to 2
      const aspect  = w / h;
      const sizeX   = aspect >= 1 ? 2 : 2 * aspect;
      const sizeZ   = aspect >= 1 ? 2 / aspect : 2;

      // Max visual height — scale so crater relief is readable
      const heightScale = 0.5;   // world units across each site's elevation range

      const geometry = new THREE.PlaneGeometry(sizeX, sizeZ, segX, segZ);
      geometry.rotateX(-Math.PI / 2);   // lay flat

      const pos = geometry.attributes.position;
      const vertCount = pos.count;

      // PlaneGeometry vertices go row-by-row, left→right, top→bottom (when rotated)
      // After rotateX: x stays x, y is up, z is old -y (south→north)
      // Heightmap row 0 = north, row (h-1) = south → matches UV top→bottom

      // Per-vertex grayscale color buffer
      const colors = new Float32Array(vertCount * 3);

      for (let i = 0; i < vertCount; i++) {
        const col = i % w;                 // 0..w-1  left→right (west→east)
        const row = Math.floor(i / w);     // 0..h-1  top→bottom (north→south)

        // pixel index — RGBA stored top-left first
        const px = (row * w + col) * 4;
        const r  = pixels[px];            // 8-bit, 0=low, 255=high

        // normalised elevation → world Y
        const normElev = r / 255;
        const worldY   = normElev * heightScale;
        pos.setY(i, worldY);

        // grayscale: low elevation → near black, high → near white
        // slight gamma curve (pow 0.7) so mid tones open up a bit
        const grey = Math.pow(normElev, 0.7);
        colors[i * 3 + 0] = grey;
        colors[i * 3 + 1] = grey;
        colors[i * 3 + 2] = grey;
      }

      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      pos.needsUpdate = true;
      geometry.computeVertexNormals();

      /* ── materials ──────────────────────────────────────── */
      // Solid filled mesh with per-vertex grayscale, no lighting
      const solidMat = new THREE.MeshBasicMaterial({
        vertexColors: true,
        side: THREE.FrontSide,
        polygonOffset: true,
        polygonOffsetFactor: 1,
        polygonOffsetUnits: 1,
      });

      // Subtle dark wireframe so the grid still reads over the fill
      const wireMat = new THREE.MeshBasicMaterial({
        color: 0x000000,
        wireframe: true,
        opacity: 0.25,
        transparent: true,
      });

      const solid = new THREE.Mesh(geometry, solidMat);
      const wire  = new THREE.Mesh(geometry, wireMat);

      const group = new THREE.Group();
      group.add(solid);
      group.add(wire);

      // Center vertically so camera target (0,0,0) sits at mid-height
      const halfH = heightScale / 2;
      group.position.y = -halfH;

      scene.add(group);
    }

    function formatCoordinate(value, positiveDirection, negativeDirection) {
      const direction = value < 0 ? negativeDirection : positiveDirection;
      return `${Math.abs(value)}°${direction}`;
    }

    function updateSiteDetails(site) {
      const min = site.elevation.min;
      const max = site.elevation.max;
      document.title = `Mars — ${site.name} Heightmap`;
      document.getElementById('site-name').textContent = site.name;
      document.getElementById('site-details').textContent =
        `Mars · ${formatCoordinate(site.location.latitude, 'N', 'S')} ` +
        `${formatCoordinate(site.location.longitude, 'E', 'W')} · ${site.source}`;
      document.getElementById('elevation-range').textContent =
        `MIN  ${min} m\nMAX  ${max} m\nΔALT   ${max - min} m`;
    }

    function createSiteOption(site) {
      const button = document.createElement('button');
      button.className = 'site-option';
      button.type = 'button';

      const name = document.createElement('strong');
      name.textContent = site.name;
      const elevation = document.createElement('span');
      elevation.textContent = `Elevation: ${site.elevation.min} to ${site.elevation.max} m`;
      const location = document.createElement('span');
      location.textContent =
        `${formatCoordinate(site.location.latitude, 'N', 'S')} · ` +
        `${formatCoordinate(site.location.longitude, 'E', 'W')}`;
      button.append(name, elevation, location);
      button.addEventListener('click', () => selectSite(site));
      return button;
    }

    async function selectSite(site) {
      const loading = document.getElementById('loading');
      const loadingMessage = loading.querySelector('p');
      loadingMessage.textContent = `Parsing ${site.name} elevation data…`;
      loading.classList.remove('hidden');

      try {
        await buildTerrain(site);
        updateSiteDetails(site);
        document.getElementById('site-picker').classList.remove('visible');
        animate();
        loading.classList.add('hidden');
      } catch (err) {
        console.error(`Failed to build terrain for ${site.name}:`, err);
        loadingMessage.textContent = `Error loading ${site.name}. Please reload and try again.`;
      }
    }

    /* ── keyboard: reset camera ────────────────────────── */
    window.addEventListener('keydown', e => {
      if (e.key === 'r' || e.key === 'R') {
        camera.position.copy(INIT_CAM);
        controls.target.set(0, 0, 0);
        controls.update();
      }
    });

    /* ── resize ────────────────────────────────────────── */
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ── render loop ───────────────────────────────────── */
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    /* ── boot ──────────────────────────────────────────── */
    const loading = document.getElementById('loading');

    Promise.all([
      fetch('output/mars_sites_metadata.json').then(response => {
        if (!response.ok) {
          throw new Error(`Could not load site metadata (${response.status})`);
        }
        return response.json();
      }),
      Promise.resolve(JEZERO)
    ]).then(([sites, jezero]) => {
      const allSites = [jezero, ...sites];
      const siteList = document.getElementById('site-list');
      allSites.forEach(site => siteList.appendChild(createSiteOption(site)));
      loading.classList.add('hidden');
      document.getElementById('site-picker').classList.add('visible');
    }).catch(err => {
      console.error('Failed to load Mars site metadata:', err);
      loading.querySelector('p').textContent = 'Error loading Mars sites. Please reload the page.';
    });
  </script>
</body>
</html>
